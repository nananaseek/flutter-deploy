server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Flutter SPA routes (History URL strategy).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Entry point and Flutter's update metadata must be revalidated on each visit.
    location = /                          { try_files /index.html =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /index.html                { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /flutter_bootstrap.js      { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /flutter.js                { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /main.dart.js              { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /flutter_service_worker.js { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /version.json              { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /manifest.json             { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /assets/AssetManifest.json { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /assets/AssetManifest.bin  { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /assets/AssetManifest.bin.json { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /assets/FontManifest.json  { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }

    # Flutter asset paths are generally stable across releases rather than content-hashed.
    # Revalidate them so changed assets do not stay stale in the browser HTTP cache.
    location /canvaskit/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # sqlite3.wasm / CanvasKit WASM require the application/wasm MIME type.
    location ~* \.wasm$ {
        try_files $uri =404;
        default_type application/wasm;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
